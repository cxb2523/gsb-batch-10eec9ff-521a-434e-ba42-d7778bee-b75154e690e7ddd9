<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Keyframe Camera Fallback - Verification</title>
    <style>
        body {
            font-family: Consolas, monospace;
            background: #1e1e1e;
            color: #dddddd;
            margin: 0;
            padding: 16px;
        }
        h1 { font-size: 18px; }
        .case {
            border: 1px solid #444;
            margin-bottom: 16px;
            padding: 8px;
        }
        .case h2 { font-size: 14px; margin: 4px 0 8px 0; }
        .views { display: flex; gap: 12px; }
        .view { flex: 1; }
        .view .label { font-size: 12px; color: #9ad; margin-bottom: 4px; }
        .view canvas, .view > div { width: 100%; height: 220px; display: block; }
        .verdict { font-size: 12px; margin-top: 6px; }
        .pass { color: #6c6; }
        .fail { color: #f66; }
        .note { color: #999; font-size: 12px; }
    </style>
    <!-- Same three scripts the player needs, served from this repo. -->
    <script src="../js/three.js"></script>
    <script src="../js/BufferGeometryUtils.js"></script>
    <script src="../player.js"></script>
</head>
<body>
    <h1>Keyframe camera fallback verification</h1>
    <p class="note">
        Open this file directly in a browser (file:// works). Each case renders
        the player and the editor viewport (key camera) at the same time and
        checks that both pick the same camera.
    </p>
    <div id="cases"></div>

    <script type="text/javascript">
        // A tiny cube model so something is actually visible.
        var cubeModel = [
            { id: 1, pos: { x: -50, y: -50, z: -50 }, conn: [2, 4, 5] },
            { id: 2, pos: { x: 50, y: -50, z: -50 }, conn: [1, 3, 6] },
            { id: 3, pos: { x: 50, y: -50, z: 50 }, conn: [2, 4, 7] },
            { id: 4, pos: { x: -50, y: -50, z: 50 }, conn: [3, 1, 8] },
            { id: 5, pos: { x: -50, y: 50, z: -50 }, conn: [6, 8, 1] },
            { id: 6, pos: { x: 50, y: 50, z: -50 }, conn: [5, 7, 2] },
            { id: 7, pos: { x: 50, y: 50, z: 50 }, conn: [6, 8, 3] },
            { id: 8, pos: { x: -50, y: 50, z: 50 }, conn: [5, 7, 4] }
        ];

        var CAMERA_KEY = -2;

        var settings = {
            length: 1000,
            framerate: 60,
            aspectRatio: '16:9',
            autoplay: false,
            loop: false,
            lineColor: 0xffffff,
            bgColor: 0x000000
        };

        // Each case: a scene plus the time to inspect and the expected camera.
        var cases = [
            {
                title: '1. Exact keyframe hit - keyframe at time 200 selects "camera B"',
                time: 200,
                expected: 'camera B',
                keyframes: [
                    { time: 0, cameraId: 0 },
                    { time: 200, cameraId: 2 }
                ]
            },
            {
                title: '2. Only a forward keyframe has a camera - time 50 falls back to "default camera"',
                time: 50,
                expected: 'default camera',
                keyframes: [
                    { time: 0, nodes: [{ id: 4, pos: { x: 0, y: 0, z: 0 } }] },
                    { time: 200, cameraId: 1 }
                ]
            },
            {
                title: '3. No keyframe has a camera - time 120 falls back to "default camera"',
                time: 120,
                expected: 'default camera',
                keyframes: [
                    { time: 0, nodes: [{ id: 4, pos: { x: 0, y: 0, z: 0 } }] },
                    { time: 200, nodes: [{ id: 4, pos: { x: 120, y: 0, z: 0 } }] }
                ]
            }
        ];

        var counter = 0;

        function buildContext(name, caseData) {
            var pcx = createContext(name);
            loadSettingsPlayer(pcx, settings);
            pcx.models = [{ name: 'cube', data: cubeModel }];
            pcx.shapes = [];
            pcx.keyframes = JSON.parse(JSON.stringify(caseData.keyframes));

            var defaultCamera = createEmptyNodePlayer('default camera', pcx.sceneTree, 1);
            createCameraPlayer(pcx, defaultCamera, 0, 45);
            defaultCamera.threeObject.position.z = 500;

            var cameraA = createEmptyNodePlayer('camera A', pcx.sceneTree, 2);
            createCameraPlayer(pcx, cameraA, 1, 60);
            cameraA.threeObject.position.set(500, 0, 0);
            cameraA.threeObject.lookAt(new THREE.Vector3(0, 0, 0));

            var cameraB = createEmptyNodePlayer('camera B', pcx.sceneTree, 3);
            createCameraPlayer(pcx, cameraB, 2, 30);
            cameraB.threeObject.position.set(0, 500, 0);
            cameraB.threeObject.lookAt(new THREE.Vector3(0, 0, 0));

            var cube = createEmptyNodePlayer('cube', pcx.sceneTree, 4);
            createModelPlayer(pcx, cube, 'cube');

            return pcx;
        }

        function makeView(container, labelText) {
            var wrapper = document.createElement('div');
            wrapper.className = 'view';
            var label = document.createElement('div');
            label.className = 'label';
            label.textContent = labelText;
            wrapper.appendChild(label);
            var div = document.createElement('div');
            wrapper.appendChild(div);
            container.appendChild(wrapper);
            return div;
        }

        function renderInto(pcx, div, cameraNode, time) {
            div.appendChild(pcx.renderer.domElement);
            var width = div.clientWidth || 480;
            var height = div.clientHeight || 220;
            pcx.renderer.setSize(width, height, false);
            pcx.renderer.domElement.style.width = '100%';
            pcx.renderer.domElement.style.height = '100%';
            pcx.scene.background = new THREE.Color(pcx.settings.bgColor);
            seekTimePlayer(pcx, time);
            return renderWithCamera(pcx.renderer, pcx.scene, cameraNode);
        }

        function runCase(caseData, index) {
            var caseDiv = document.createElement('div');
            caseDiv.className = 'case';
            document.getElementById('cases').appendChild(caseDiv);

            var title = document.createElement('h2');
            title.textContent = caseData.title;
            caseDiv.appendChild(title);

            var views = document.createElement('div');
            views.className = 'views';
            caseDiv.appendChild(views);

            // Player side uses seekTimePlayer exactly like playPlayer() does.
            var playerPcx = buildContext('verify-player-' + index, caseData);
            var playerCamera = seekTimePlayer(playerPcx, caseData.time);
            var playerDiv = makeView(views, 'player (seekTimePlayer)');
            renderInto(playerPcx, playerDiv, playerCamera, caseData.time);

            // Editor viewport side uses the key camera path from update().
            var editorPcx = buildContext('verify-editor-' + index, caseData);
            var editorDiv = makeView(views, 'editor viewport (key camera)');
            var viewport = { cameraId: CAMERA_KEY, renderer: editorPcx.renderer };
            var rendered = renderCameraViewport(editorPcx, viewport, true, caseData.time);

            var editorCamera = getKeyframeCamera(editorPcx, caseData.time);
            renderInto(editorPcx, editorDiv, editorCamera, caseData.time);

            var verdict = document.createElement('div');
            verdict.className = 'verdict';
            var playerName = playerCamera ? playerCamera.name : '(none)';
            var editorName = editorCamera ? editorCamera.name : '(none)';
            // The player and the editor use separate contexts here, so compare
            // the resolved camera identity by name and by cameraId.
            var ok = playerCamera != null && editorCamera != null &&
                playerCamera.name === caseData.expected &&
                editorCamera.name === caseData.expected &&
                playerCamera.cameraId === editorCamera.cameraId &&
                rendered === true;
            verdict.className = 'verdict ' + (ok ? 'pass' : 'fail');
            verdict.textContent = (ok ? 'PASS' : 'FAIL') +
                ' - expected "' + caseData.expected + '", player "' + playerName +
                '", editor "' + editorName + '"';
            caseDiv.appendChild(verdict);
        }

        cases.forEach(function (caseData, index) {
            runCase(caseData, index);
        });
    </script>
</body>
</html>
